# Dedicated disposable PostgreSQL; DO NOT point customer data or a production API here.
# Set DB_PASSWORD in shell or .env; PostgreSQL port is loopback-only.
services:
  v86-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a disposable test-only DB_PASSWORD}
      POSTGRES_DB: aile_test_v86
    ports:
      - "127.0.0.1:55486:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d aile_test_v86"]
      interval: 2s
      timeout: 2s
      retries: 30
    # No bind mount, no external shared volume; docker compose down -v destroys data.
